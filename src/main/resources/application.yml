spring:
  application:
    name: portfolio-manager

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/portfolio_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:n3u3da!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Application specific configuration
portfolio:
  base-currency: ${BASE_CURRENCY:INR}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  snapshot:
    cron: ${SNAPSHOT_CRON:0 5 0 * * *}   # every day just after midnight - records daily wealth snapshot

logging:
  level:
    com.portfoliomanager: INFO
    org.flywaydb: INFO
